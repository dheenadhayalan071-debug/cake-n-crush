<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF7E9" />

    <title>Cake N Crush — Patisserie &amp; Celebration Cakes in Madurai</title>
    <meta
      name="description"
      content="Cake N Crush is a patisserie and cake shop in Park Town, Madurai. Explore eggless cakes, celebration cakes, chocolate cakes, 1kg cakes, plum cakes and custom celebration cakes."
    />

    <!-- Default social card; per-route values are applied by <Seo/>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cake N Crush" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Cake N Crush — Patisserie &amp; Celebration Cakes in Madurai"
    />
    <meta
      property="og:description"
      content="Little moments, big celebrations and beautifully crafted cakes for every occasion — baked to order in Park Town, Madurai."
    />
    <meta property="og:image" content="/images/hero-cake/hero-cake-900.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://cakencrush.example.com/" />

    <!-- Variable Fraunces: a single file covers every weight plus the SOFT/WONK
         axes the headlines rely on, so there is no second display download. -->
    <link rel="preload" href="/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/images/hero-cake/hero-cake-900.webp"
      imagesrcset="/images/hero-cake/hero-cake-480.webp 480w, /images/hero-cake/hero-cake-900.webp 900w"
      imagesizes="(min-width: 1024px) 40vw, (min-width: 768px) 38vw, 92vw"
      fetchpriority="high"
    />

    <!--
      Structured data for the business is generated per-route by
      src/components/seo/Seo.jsx. No ratings or reviews are emitted.
    -->
  </head>
